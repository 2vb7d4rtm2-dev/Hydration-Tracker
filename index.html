<html lang="en">
<head>

<link rel="manifest" href="manifest.json"><title>HydroPop</title>
<style>
:root{--blue:#147dff;--cyan:#18d8ff;--deep:#153e78;--pink:#ff4fa3;--purple:#7b5cff;--yellow:#ffd83d;--orange:#ff8b36;--bg:#f7fbff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,#dff8ff 0,transparent 30%),radial-gradient(circle at 100% 25%,#ffe2f2 0,transparent 27%),var(--bg);color:var(--deep)}
body{overflow-x:hidden}.app{min-height:100svh;max-width:620px;margin:auto;padding:12px 16px 15px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;z-index:2}.logo{font-size:26px;font-weight:950;letter-spacing:-1.3px;color:var(--blue);text-shadow:2px 2px 0 #fff}.logo span{color:var(--pink)}
.icon{border:0;background:#fff;border-radius:15px;width:45px;height:45px;font-size:21px;box-shadow:0 8px 25px #126cff20;cursor:pointer}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1;min-height:0}.info{width:42%;display:flex;flex-direction:column;gap:14px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:#6684a9}.total{font-size:62px;line-height:.86;font-weight:950;letter-spacing:-4px}.total small{font-size:21px;letter-spacing:0}.goal{font-weight:800;font-size:17px}.goal strong{color:var(--blue)}
.buttons{display:grid;gap:10px}.add{border:0;border-radius:18px;padding:15px 6px;font-size:18px;font-weight:950;color:white;box-shadow:0 9px 20px #147dff35;cursor:pointer;transition:transform .12s}.add:active{transform:scale(.94)}.add12{background:linear-gradient(135deg,#20d9ff,#1682ff)}.add20{background:linear-gradient(135deg,#7d62ff,#c342ff)}.reset{border:0;background:transparent;color:#7890aa;font-weight:750;padding:4px}
.meterWrap{height:min(74svh,570px);width:47%;display:flex;justify-content:center;align-items:stretch;position:relative}.meter{position:relative;width:74px;height:100%;border-radius:40px;background:#e9f4ff;border:5px solid #fff;box-shadow:inset 0 0 0 2px #d4e9ff,0 18px 45px #167dff1e;overflow:visible}
.meter:after{content:"";position:absolute;inset:5px;border-radius:31px;background:linear-gradient(110deg,#ffffff66,transparent 35%);pointer-events:none;z-index:4}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:0 0 32px 32px;background:linear-gradient(180deg,#25dcff,#1481ff);transition:height .65s cubic-bezier(.2,.9,.2,1);overflow:visible}.fill:before{content:"";position:absolute;left:-5px;right:-5px;top:-11px;height:20px;border-radius:50%;background:#35dfff;box-shadow:0 0 20px #20c8ff99;animation:waterWave 2.4s ease-in-out infinite}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#ffffff22,transparent 30%,#ffffff18 60%,transparent);background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes waterWave{0%,100%{transform:scaleX(1) rotate(0deg)}50%{transform:scaleX(1.06) rotate(.8deg)}}@keyframes shine{to{background-position:-200% 0}}
.mark{position:absolute;left:88px;transform:translateY(50%);font-size:11px;font-weight:900;color:#7890aa;white-space:nowrap}.mark i{display:inline-block;width:8px;height:2px;background:#b9cce0;margin-right:5px}.pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:15px;font-weight:950;color:#fff;text-shadow:0 2px 8px #0054a988;z-index:6}
.drips,.puddle{display:none}.goalReached .drips{display:block;position:absolute;left:50%;top:-8px;width:1px;height:calc(100% + 18px);z-index:8}.drop{position:absolute;width:9px;height:15px;border-radius:60% 60% 60% 60%;background:#21cfff;filter:drop-shadow(0 2px 3px #0077aa44);animation:fallDrop 2.8s linear infinite}.drop:nth-child(1){left:12px;animation-delay:.2s}.drop:nth-child(2){left:38px;animation-delay:1.1s}.drop:nth-child(3){left:-27px;animation-delay:1.8s}
.goalReached .fill{animation:sloshover 1.9s ease-in-out infinite}.goalReached .fill:before{height:28px;top:-14px;animation:sloshtop 1.15s ease-in-out infinite}.puddle{position:absolute;display:none;bottom:-15px;left:50%;transform:translateX(-50%);width:120px;height:20px;border-radius:50%;background:radial-gradient(ellipse,#35d8ff88,#35d8ff20 65%,transparent 70%);animation:puddle 2s ease-in-out infinite}.goalReached .puddle{display:block}
@keyframes sloshover{0%,100%{transform:translateX(0)}25%{transform:translateX(1px)}50%{transform:translateX(-1px)}75%{transform:translateX(1px)}}@keyframes sloshtop{0%,100%{border-radius:48% 52% 48% 52%;transform:translateX(0) scaleY(1)}50%{border-radius:58% 42% 60% 40%;transform:translateX(-5px) scaleY(1.22)}}@keyframes fallDrop{0%{top:0;opacity:0}12%{opacity:1}100%{top:100%;opacity:.1}}@keyframes puddle{50%{transform:translateX(-50%) scale(1.13,.8)}}
.footer{text-align:center;font-size:11px;font-weight:700;color:#8ba0b8}
.overlay{position:fixed;inset:0;background:#061a35aa;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.overlay.show{display:flex}.card{background:#fff;width:min(94vw,480px);max-height:88svh;overflow:auto;border-radius:30px;padding:22px;box-shadow:0 30px 90px #001b4944}.card h2{margin:0 0 4px;font-size:28px}.sub{color:#7489a3;font-size:14px;margin-bottom:17px}.field{margin:15px 0}.field label{font-weight:900;display:block;margin-bottom:7px}.field input,.field textarea{width:100%;border:2px solid #dcecff;border-radius:13px;padding:11px;font:inherit}.field textarea{min-height:90px}.level{border:1px solid #e0ecfb;border-radius:16px;padding:11px;margin:9px 0}.level b{color:var(--blue)}.level textarea{margin-top:7px;min-height:60px}.actions{display:flex;gap:9px;position:sticky;bottom:0;background:#fff;padding-top:10px}.primary,.secondary{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900}.primary{background:var(--blue);color:white}.secondary{background:#edf5ff;color:var(--deep)}
.celebrate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none}.celebrate.show{display:flex}.celebrate:before{content:"";position:absolute;inset:0;background:#ffffff18;backdrop-filter:blur(1px)}.box{position:relative;z-index:4;background:#fff;border-radius:32px;padding:28px 25px;max-width:88vw;text-align:center;box-shadow:0 25px 100px #001b4950;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}.box h2{margin:0 0 8px;font-size:32px}.box p{margin:0;color:#46627f;font-weight:800;font-size:19px}.confetti{position:absolute;top:-30px;width:10px;height:18px;border-radius:3px;animation:confFall linear forwards;z-index:2}
@keyframes pop{from{transform:scale(.35) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes confFall{to{transform:translate3d(var(--dx),110svh,0) rotate(900deg);opacity:0}}
@media(max-width:380px){.total{font-size:52px}.meter{width:65px}.mark{left:77px}.add{padding:13px 5px}}

/* ===== HydroPop v3 visual refinement ===== */
:root{
  --bg:#2d8cff;
  --bg2:#61d7ff;
  --ink:#ffffff;
  --muted:#e8f7ff;
  --card:rgba(255,255,255,.94);
  --blue:#168cff;
  --blue2:#35c8ff;
  --pink:#ff4fa3;
  --purple:#9b5cff;
  --yellow:#ffd43b;
  --orange:#ff8a3d;
  --green:#42e58b;
}

/* Make the entire app blue-forward with bright playful accents. */
body{
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,.30) 0 5%, transparent 6%),
    radial-gradient(circle at 86% 18%, rgba(255,212,59,.32) 0 7%, transparent 8%),
    radial-gradient(circle at 22% 78%, rgba(255,79,163,.24) 0 8%, transparent 9%),
    linear-gradient(145deg,#1678ed 0%,#2d8cff 38%,#43c9f5 72%,#74e5ff 100%);
  color:var(--ink);
}

.app{
  background:transparent;
}

.brand-badge{
  background:linear-gradient(135deg,#fff 0%,#dff7ff 100%);
  color:#1678ed;
  box-shadow:0 10px 26px rgba(0,45,130,.18);
}

.logo-mark{
  background:linear-gradient(135deg,#ff4fa3,#9b5cff 48%,#168cff);
  box-shadow:0 8px 20px rgba(111,49,220,.28);
}

.settings-btn{
  background:rgba(255,255,255,.22);
  color:#fff;
  border-color:rgba(255,255,255,.42);
  backdrop-filter:blur(10px);
}

.total-card{
  background:rgba(255,255,255,.96);
  box-shadow:0 18px 44px rgba(0,45,130,.20);
  border-color:rgba(255,255,255,.78);
}

.total-value{color:#126ee0;}
.total-goal{color:#4d7aa8;}

.action-row .btn.plus12{
  background:linear-gradient(135deg,#ff4fa3,#ff7b68);
}
.action-row .btn.plus20{
  background:linear-gradient(135deg,#7b55ff,#168cff);
}

.btn{
  border:2px solid rgba(255,255,255,.72);
  box-shadow:0 12px 24px rgba(0,46,125,.18);
}
.btn:active{transform:translateY(2px) scale(.98);}

.reset-btn{
  background:rgba(255,255,255,.20);
  color:#fff;
  border-color:rgba(255,255,255,.45);
}

/* Slightly wider meter, still tall and mobile-first. */
.meter-wrap{
  width:min(205px, 48vw);
}
.meter{
  width:100%;
  border-color:rgba(255,255,255,.90);
  background:rgba(8,77,160,.30);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.18),
    0 22px 48px rgba(0,43,120,.24);
}

.meter::before{
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,.95) 0 4px, transparent 5px),
    radial-gradient(circle at 72% 14%, rgba(255,212,59,.9) 0 5px, transparent 6px),
    radial-gradient(circle at 45% 76%, rgba(255,79,163,.72) 0 4px, transparent 5px);
  opacity:.75;
}

.water{
  background:
    linear-gradient(180deg,#dffbff 0%,#53d8ff 8%,#168cff 52%,#6b55ff 100%);
  box-shadow:inset 0 8px 0 rgba(255,255,255,.18);
}

/* More natural liquid crown at the top of the water. */
.water-top{
  height:32px !important;
  top:-17px !important;
  border-radius:50% 48% 42% 58% / 72% 66% 38% 46% !important;
  background:
    radial-gradient(ellipse at 18% 62%, rgba(255,255,255,.86) 0 10%, transparent 11%),
    radial-gradient(ellipse at 62% 38%, rgba(255,255,255,.52) 0 13%, transparent 14%),
    linear-gradient(180deg,#e8fdff 0%,#7ee8ff 28%,#35c8ff 100%) !important;
  filter:drop-shadow(0 4px 4px rgba(0,63,150,.16));
  transform-origin:center bottom;
  animation:liquidCrown 2.6s ease-in-out infinite;
}

@keyframes liquidCrown{
  0%,100%{transform:scaleX(1) translateY(0) rotate(0deg);}
  25%{transform:scaleX(1.045) translateY(1px) rotate(-.7deg);}
  50%{transform:scaleX(.965) translateY(-1px) rotate(.6deg);}
  75%{transform:scaleX(1.035) translateY(1px) rotate(-.35deg);}
}

/* Goal state: keep the liquid crown and overflow alive instead of replacing them
   with a one-frame flash. */
.goal-reached .water{
  overflow:visible !important;
}
.goal-reached .water-top{
  animation:goalCrown 1.35s ease-in-out infinite !important;
}
@keyframes goalCrown{
  0%,100%{transform:scaleX(1.02) translateY(0) rotate(0deg);}
  20%{transform:scaleX(1.10) translateY(2px) rotate(-1.2deg);}
  45%{transform:scaleX(.95) translateY(-2px) rotate(1deg);}
  70%{transform:scaleX(1.08) translateY(1px) rotate(-.8deg);}
}

.goal-reached .meter{
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.24),
    0 0 0 5px rgba(255,255,255,.18),
    0 24px 64px rgba(255,79,163,.22),
    0 0 52px rgba(53,200,255,.30);
}

/* Keep the goal celebration above the normal UI. */
.celebration-overlay{
  z-index:1000 !important;
}
.celebration-overlay.show{
  display:flex !important;
  opacity:1 !important;
  pointer-events:auto;
}
.celebration-overlay .celebration-card{
  animation:celebrateCardIn .55s cubic-bezier(.2,1.4,.3,1) both !important;
}
@keyframes celebrateCardIn{
  0%{opacity:0;transform:translateY(28px) scale(.72) rotate(-2deg);}
  70%{opacity:1;transform:translateY(-4px) scale(1.04) rotate(.5deg);}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0);}
}

/* Bright accent pills/details if present. */
.progress-label,.milestone-chip,.goal-chip{
  background:rgba(255,255,255,.22) !important;
  border-color:rgba(255,255,255,.48) !important;
  color:#fff !important;
}


/* ===== HydroPop v4 ===== */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap');

:root{
  --v4-ink:#123d73;
  --v4-blue:#168cff;
  --v4-cyan:#35d9ff;
  --v4-pink:#ff5aaa;
  --v4-purple:#765cff;
}
html,body{
  font-family:'Fredoka',ui-rounded,system-ui,sans-serif;
  background:#83dcff;
}
body{
  min-height:100svh;
  overflow-x:hidden;
  position:relative;
}
.environment{
  position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 18% 16%,rgba(255,255,255,.78) 0 3px,transparent 4px),
    radial-gradient(circle at 74% 24%,rgba(255,255,255,.55) 0 2px,transparent 3px),
    linear-gradient(180deg,#69d5ff 0%,#9beaff 52%,#c8f5db 100%);
}
.environment:before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 40%,transparent 0 34%,rgba(24,113,190,.12) 100%);
}
.sun{
  position:absolute; width:94px;height:94px;border-radius:50%;right:-18px;top:54px;
  background:#ffe36b; box-shadow:0 0 0 16px #ffe36b22,0 0 55px #fff2a366;
}
.cloud{position:absolute;filter:drop-shadow(0 8px 10px #2785a822);opacity:.9}
.cloud i{position:absolute;display:block;background:#fff;border-radius:50%}
.cloud i:nth-child(1){width:70px;height:35px;left:0;top:18px;border-radius:30px}
.cloud i:nth-child(2){width:46px;height:46px;left:25px;top:0}
.cloud i:nth-child(3){width:58px;height:38px;left:54px;top:14px}
.cloud-a{left:-8px;top:118px;width:130px;height:55px;transform:scale(.85)}
.cloud-b{right:8px;top:210px;width:125px;height:55px;transform:scale(.68);opacity:.62}
.hill{position:absolute;left:-15%;width:130%;border-radius:50% 50% 0 0}
.hill-back{height:180px;bottom:48px;background:#72d9a5;transform:rotate(-2deg)}
.hill-front{height:145px;bottom:8px;background:#4cc58e;transform:rotate(2deg)}
.ground{position:absolute;left:0;right:0;bottom:0;height:58px;background:#38b67d}
.sparkle{position:absolute;color:#fff6a8;font-weight:800;text-shadow:0 2px 5px #168cff55;animation:floatSparkle 3.5s ease-in-out infinite}
.s1{left:20%;top:29%;font-size:19px}.s2{right:20%;top:42%;font-size:14px;animation-delay:1.1s}.s3{left:9%;top:57%;font-size:22px;animation-delay:2s}
@keyframes floatSparkle{50%{transform:translateY(-8px) rotate(12deg);opacity:.65}}

.app{position:relative;z-index:2;max-width:620px;padding-top:15px}
.logo{font-family:'Baloo 2',sans-serif;font-size:30px;letter-spacing:-1px;text-shadow:2px 3px 0 #fff}
.icon{font-family:inherit;border-radius:18px;background:#ffffffcc;backdrop-filter:blur(8px)}

.info{gap:12px}
.eyebrow{font-family:'Baloo 2',sans-serif;font-size:13px;letter-spacing:1.1px;color:#2f6692}
.total{font-family:'Baloo 2',sans-serif;font-size:66px;letter-spacing:-3px;color:#126ee0;text-shadow:2px 3px 0 #fff}
.goal{font-family:'Baloo 2',sans-serif}
.add{font-family:'Fredoka',sans-serif;border-radius:20px;padding:14px 6px}
.reset{font-family:'Fredoka',sans-serif}

.meterWrap{width:min(190px,47vw)}
.meter{
  width:58px;
  border-width:4px;
  border-radius:32px;
  background:rgba(9,83,157,.22);
  box-shadow:inset 0 0 0 2px #ffffff38,0 20px 42px #07519d35;
}
.meter-glass{
  position:absolute;inset:5px;border-radius:25px;z-index:5;pointer-events:none;
  background:linear-gradient(105deg,#fff5 0 13%,transparent 30% 72%,#fff2 82%,transparent 100%);
}
.fill{
  border-radius:0 0 27px 27px;
  background:linear-gradient(180deg,#bff8ff 0%,#38d5ff 8%,#168cff 52%,#7259ff 100%);
  transition:height .7s cubic-bezier(.18,.92,.24,1);
}
.fill:before{
  left:-8px;right:-8px;top:-10px;height:20px;
  background:linear-gradient(180deg,#e8fdff,#58e1ff);
  border-radius:50% 46% 54% 50%;
  box-shadow:0 0 18px #20c8ff88;
  animation:bubblyTop 1.9s ease-in-out infinite;
}
.fill:after{opacity:.65}
.bubble-field{
  position:absolute;inset:0;overflow:hidden;border-radius:inherit;opacity:0;
  background:
    radial-gradient(circle at 20% 82%,#fff9 0 3px,transparent 4px),
    radial-gradient(circle at 74% 70%,#fff8 0 4px,transparent 5px),
    radial-gradient(circle at 45% 52%,#fff7 0 2px,transparent 3px),
    radial-gradient(circle at 84% 36%,#fff8 0 3px,transparent 4px);
}
.pct{font-family:'Baloo 2',sans-serif;font-size:16px}
@keyframes bubblyTop{
  0%,100%{transform:scaleX(1) translateY(0);border-radius:50% 44% 56% 48%}
  30%{transform:scaleX(1.08) translateY(-2px);border-radius:42% 58% 45% 55%}
  60%{transform:scaleX(.94) translateY(1px);border-radius:58% 42% 56% 44%}
}

.goalReached .meter{
  box-shadow:inset 0 0 0 2px #ffffff45,0 0 0 4px #ffffff2b,0 25px 65px #ff5aaa38,0 0 50px #35d9ff4d;
}
.goalReached .fill{animation:waterBody 2.2s ease-in-out infinite}
.goalReached .fill:before{animation:bubblyTop .75s ease-in-out infinite}
.goalReached .bubble-field{opacity:.7;animation:bubblesShift 2.2s linear infinite}
@keyframes waterBody{
  0%,100%{transform:translateX(0) scaleX(1)}
  25%{transform:translateX(1px) scaleX(1.025)}
  50%{transform:translateX(-1px) scaleX(.98)}
  75%{transform:translateX(1px) scaleX(1.02)}
}
@keyframes bubblesShift{to{transform:translateY(-18px)}}

/* Continuous geyser: a narrow center jet plus chunky, playful droplets. */
.geyser{position:absolute;left:50%;top:-7px;width:1px;height:1px;z-index:8;pointer-events:none}
.geyser i{
  position:absolute;display:block;width:8px;height:14px;border-radius:70% 70% 55% 55%;
  background:#63e7ff;box-shadow:0 1px 5px #0874bd44;
  opacity:0;transform:translate(-50%,0);
}
.goalReached .geyser i{animation:geyserJet 1.35s cubic-bezier(.25,.8,.45,1) infinite}
.geyser i:nth-child(1){animation-delay:0s}.geyser i:nth-child(2){animation-delay:.18s;left:-7px;width:6px;height:11px}
.geyser i:nth-child(3){animation-delay:.36s;left:8px;width:7px;height:12px}
.geyser i:nth-child(4){animation-delay:.54s;left:-14px;width:5px;height:9px}
.geyser i:nth-child(5){animation-delay:.72s;left:15px;width:5px;height:9px}
@keyframes geyserJet{
  0%{top:0;opacity:0;transform:translate(-50%,0) scale(.6)}
  12%{opacity:1}
  46%{opacity:1;transform:translate(-50%,-82px) scale(1)}
  100%{top:-105px;opacity:0;transform:translate(-50%,-125px) scale(.45)}
}

.celebrate .box{font-family:'Fredoka',sans-serif}
.celebrate .box h2{font-family:'Baloo 2',sans-serif;font-size:35px;color:#126ee0}
.goalCelebration .box{animation:celebrateCardIn .55s cubic-bezier(.2,1.4,.3,1) both}
@media(max-width:380px){.meter{width:52px}.total{font-size:58px}}

</style>
</head>
<body>
<div class="environment" aria-hidden="true">
    <div class="cloud cloud-a"><i></i><i></i><i></i></div>
  <div class="cloud cloud-b"><i></i><i></i><i></i></div>
  <div class="hill hill-back"></div>
  <div class="hill hill-front"></div>
  <div class="sparkle s1">✦</div><div class="sparkle s2">✦</div><div class="sparkle s3">•</div>
  <div class="ground"></div>
</div>
<div class="app"><header><button class="icon" id="settingsBtn" aria-label="Open settings" title="Settings"></button></header>
<main class="hero"><section class="info"><div><div class="eyebrow">Today's hydration</div><div class="total"><span id="total">0</span><small> oz</small></div><div class="goal">Goal <strong id="goal">125 oz</strong></div></div>
<div class="buttons"><button class="add add12" onclick="addWater(12)">+ 12 oz</button><button class="add add20" onclick="addWater(20)">+ 20 oz</button></div></section>

<script>
 const KEY="hydropop-v4-2";const fallback={goal:125,total:0,prompts:{},final:["You did it! Goal crushed! 💦","Hydrated and unstoppable! 💦","Look at you, hydration legend! ✨"],themeMode:"auto"};
  let state=JSON.parse(localStorage.getItem(KEY)||"null")||fallback;state.themeMode=["day","night","auto"].includes(state.themeMode)?state.themeMode:"auto";function persistState(){localStorage.setItem(KEY,JSON.stringify(state))}
 function levels(){let a=[];for(let n=25;n<=state.goal;n+=25)a.push(n);return a}function pick(a){return a[Math.floor(Math.random()*a.length)]}
 function syncBubbles(progress){const field=document.querySelector(".bubble-field");const ratio=Math.max(0,Math.min(1,progress/100));const count=Math.round(130*(Math.exp(3*ratio)-1)/(Math.exp(3)-1));while(field.children.length<count){const b=document.createElement("i");b.className="rising-bubble";b.style.setProperty("--bubble-left",(4+Math.random()*92)+"%");b.style.setProperty("--bubble-size",(2+Math.random()*5)+"px");b.style.setProperty("--bubble-duration",(2.1+Math.random()*3.3)+"s");b.style.setProperty("--bubble-delay",(-Math.random()*5)+"s");b.style.setProperty("--bubble-drift",(Math.random()*28-14)+"px");field.appendChild(b)}while(field.children.length>count)field.lastElementChild.remove()}
  function initGeyserBubbles(){
    const svg=document.querySelector(".geyser-shape");
    const body=svg.querySelector("path");
    body.setAttribute("d","M102 190 C106 177 107 138 110 100 C93 94 66 94 38 92 C20 90 9 86 2 82 C22 68 41 49 61 35 C80 19 100 10 120 10 C140 10 160 19 179 35 C199 49 218 68 238 82 C231 86 220 90 202 92 C174 94 147 94 130 100 C133 138 134 177 138 190 Z");

    const baseStop=document.createElementNS("http://www.w3.org/2000/svg","stop");
    baseStop.setAttribute("offset","1");
    baseStop.setAttribute("stop-color","#38d5ff");

    const currents=[
      "M118 185 C114 176 116 137 120 101 C107 84 88 69 69 53",
      "M122 185 C126 176 124 137 120 101 C133 84 152 69 171 53",

    ];

      ["ridge-back","M12 79 C45 61 80 43 120 32 C160 43 195 61 228 79"],
      ["ridge-front","M18 82 C54 74 87 61 120 55 C153 61 186 74 222 82"]

    const points=[

      [112,158],[131,153],[107,144],[121,139],[133,133],[111,125],[127,118],[115,109],[124,102],
      [75,84],[98,84],[120,85],[145,84],[166,84],[60,76],[82,76],[105,75],[135,75],[160,76],[180,76],
      [75,63],[98,61],[120,59],[142,61],[165,63],[85,48],[105,45],[135,45],[155,48]

    points.forEach(([x,y],i)=>{

 function render(){document.getElementById("total").textContent=state.total;document.getElementById("goal").textContent=state.goal+" oz";const isNight=state.themeMode==="night"||(state.themeMode==="auto"&&Number(state.total)>=100);document.body.classList.toggle("night-mode",isNight);let p=Math.min(100,state.total/state.goal*100);document.getElementById("fill").style.height=p+"%";syncBubbles(p);document.getElementById("pct").textContent=Math.round(p)+"%";document.getElementById("meter").classList.toggle("goalReached",state.total>=state.goal);let marks=document.getElementById("marks");marks.innerHTML="";levels().forEach(n=>{let m=document.createElement("div");m.className="mark";m.style.bottom=n/state.goal*100+"%";m.innerHTML="<i></i>"+n+" oz";marks.appendChild(m)})}
 function addWater(oz){let before=state.total;state.total+=oz;persistState();render();let hit=levels().find(n=>before<n&&state.total>=n);if(state.total>=state.goal&&before<state.goal)showCelebration(true,pick(state.final?.length?state.final:fallback.final));else if(hit){let arr=state.prompts[hit]||[];showCelebration(false,pick(arr.length?arr:[`Nice! You reached ${hit} oz! 💧`]))}}
function confetti(count){let layer=document.getElementById("confetti");layer.innerHTML="";let colors=["#147dff","#18d8ff","#ff4fa3","#7b5cff","#ffd83d","#ff8b36","#31d68a"];for(let i=0;i<count;i++){let c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"%";c.style.top=(-30-Math.random()*110)+"vh";c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.setProperty("--dx",(Math.random()*220-110)+"px");c.style.animationDuration=(2.2+Math.random()*2.1)+"s";c.style.animationDelay=Math.random()*.5+"s";layer.appendChild(c)}}
function waterSplash(){
  const layer=document.getElementById("waterSplash");
  layer.replaceChildren();
  document.getElementById("confetti").replaceChildren();
  const rect=document.getElementById("meter").getBoundingClientRect();
  const originX=rect.left+rect.width/2;
  const originY=rect.top+8;
  layer.style.setProperty("--splash-origin-x",originX+"px");
  layer.style.setProperty("--splash-origin-y",originY+"px");
  for(let i=0;i<3;i++){
    const ring=document.createElement("span");
    ring.className="splash-ring";
    ring.style.animationDelay=(i*.24)+"s";

  }

    const angle=Math.random()*Math.PI*2;
    const distance=reach*(.35+Math.random()*.9);
    const dx=Math.cos(angle)*distance;
    const dy=Math.sin(angle)*distance;
    const drop=document.createElement("i");
    drop.className="splash-drop";
    drop.style.setProperty("--splash-x",dx+"px");
    drop.style.setProperty("--splash-y",dy+"px");

    drop.style.setProperty("--splash-mid-y",dy*.48+"px");
    const size=5+Math.random()*12;
    drop.style.setProperty("--splash-size",size+"px");
    drop.style.setProperty("--splash-height",(size*1.45)+"px");
    drop.style.setProperty("--splash-duration",(2.1+Math.random()*1.1)+"s");

 function resetToday(){const dialog=document.getElementById("resetConfirm");dialog.classList.add("show");document.getElementById("resetCancel").focus()}

  function confirmResetToday(){state.total=0;persistState();render();closeResetConfirm()}
function openSettings(){document.getElementById("goalInput").value=state.goal;document.getElementById("themeMode").value=state.themeMode||"auto";document.getElementById("finalPrompts").value=(state.final||[]).join("\n");let box=document.getElementById("levels");box.innerHTML="";levels().forEach(n=>{let d=document.createElement("div");d.className="level";d.innerHTML=`<b>${n} oz prompts</b><textarea data-level="${n}" placeholder="One prompt per line">${(state.prompts[n]||[]).join("\n").replace(/</g,"&lt;")}</textarea>`;box.appendChild(d)});document.getElementById("settings").classList.add("show")}
  settingsBtn.onclick=openSettings;cancel.onclick=()=>settings.classList.remove("show");document.getElementById("save").onclick=()=>{let g=Math.max(25,Math.round(+goalInput.value/25)*25);state.goal=g;state.themeMode=document.getElementById("themeMode").value;state.prompts={};document.querySelectorAll("[data-level]").forEach(t=>state.prompts[t.dataset.level]=t.value.split("\n").map(x=>x.trim()).filter(Boolean));state.final=finalPrompts.value.split("\n").map(x=>x.trim()).filter(Boolean);persistState();render();settings.classList.remove("show")};document.getElementById("resetConfirmAction").onclick=confirmResetToday;document.getElementById("resetCancel").onclick=closeResetConfirm;const resetDialog=document.getElementById("resetConfirm");resetDialog.addEventListener("click",e=>{if(e.target===resetDialog)closeResetConfirm()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&resetDialog.classList.contains("show"))closeResetConfirm()});initGeyserBubbles();render();
